# Builds and tests zJournal on every push/PR to main.
#   frontend: ui-library + web-app build and tests across supported Node versions.
#   backends: the four API servers' test suites (node, python, php, java).

name: Build and test zJournal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # Builds ui-library first: web-app imports its dist/, which isn't committed.
    - run: npm run build
    - run: npm test -- --watchAll=false
    - run: npm test --workspace=ui-library

  backends:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: server/python/requirements.txt
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: openssl
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - run: npm ci
    # test:server:python expects the venv at server/python/.venv, like a local setup.
    - name: Set up the Python backend's venv
      run: |
        python -m venv server/python/.venv
        server/python/.venv/bin/pip install -r server/python/requirements.txt
    - run: npm run test:servers
