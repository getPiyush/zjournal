spring.application.name=ZJournalServer
server.port=8080

zjournal.encryption-key=JagaBaliaShreekhetra
zjournal.db-file=db.json
zjournal.encryption-enabled=true

# Admin gate (com.zjournal.auth). Both auth values must be set for auth to be on. Outside
# development the app refuses to start without them. The client id must match
# REACT_APP_GOOGLE_CLIENT_ID in web-app. `npm run server` sets ZJOURNAL_ENV=development unless
# --prod is passed.
zjournal.env=${ZJOURNAL_ENV:production}
zjournal.auth.google-client-id=${ZJOURNAL_GOOGLE_CLIENT_ID:}
zjournal.auth.admin-emails=${ZJOURNAL_ADMIN_EMAILS:}

springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
